name: Build VoidDupe

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Verify plugin JAR
        run: |
          test -f build/libs/VoidDupe-1.0.0.jar
          unzip -l build/libs/VoidDupe-1.0.0.jar | grep -E '(^|/)plugin\.yml$'
          unzip -l build/libs/VoidDupe-1.0.0.jar | grep 'com/voiddupe/VoidDupe.class'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidDupe
          path: build/libs/VoidDupe-1.0.0.jar
          if-no-files-found: error
